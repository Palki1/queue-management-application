services:
  - type: web
    name: rugas-queueflow
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5050
      - key: JWT_SECRET
        generateValue: true
